# Loaded on top of src/main/resources/application.properties (classpath:/config/ wins over classpath:/),
# so tests run with the production settings and only the database is swapped.
spring.datasource.url=jdbc:mysql://localhost:3307/karrot_with_design_test

# schema.sql is CREATE TABLE IF NOT EXISTS, so recreate the throwaway test tables on every context start
# to keep them in sync with the current schema.sql.
spring.sql.init.schema-locations=classpath:reset-test-schema.sql,classpath:schema.sql
