spring.application.name=karrot
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3307/karrot_with_design
spring.datasource.username=karrot
spring.datasource.password=karrot
spring.datasource.hikari.maximum-pool-size=50
# Must cover the queueing time of a 10,000-request burst on a 50-connection pool (see design doc).
spring.datasource.hikari.connection-timeout=35000
# Default 8192 accepted sockets is below the 10,000 concurrent-request target.
server.tomcat.max-connections=10500

# Schema is owned by schema.sql/data.sql, not Hibernate.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# The database stores UTC while the host runs in KST.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true

# The design treats field type mismatches as 400, so Jackson must not silently coerce them
# (e.g. 12.5 -> 12 for price, "true" -> true for negotiable).
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
